# CI experiment for the flaky macOS smoke tests (hello: EIO on cat;
# passthrough: EPERM on xattr -w). It lives only on the fork's macfuse-exp
# branch, which drops every other workflow. It keeps rust.yml's file name and
# workflow name so `gh workflow run rust.yml --ref macfuse-exp` can dispatch
# it: workflow_dispatch needs the file to exist on the default branch too.
#
# Each job applies one variant's patch over master's code, runs the
# macfuse_smoke binary REPEATS times on one runner and records every run;
# the summary job tabulates all jobs. See .github/macfuse-exp/.
name: Rust
run-name: macfuse-exp ${{ github.event_name }} ${{ github.sha }}

on:
  push:
    branches: '*'
  workflow_dispatch:
    inputs:
      repeats:
        description: Smoke-test runs per job
        default: '15'
      variants:
        description: JSON list of variants
        default: '["baseline-nolog","pr-fix"]'

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  smoke:
    name: ${{ matrix.variant }} s${{ matrix.shard }}
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        variant: ${{ fromJSON(inputs.variants || '["baseline-nolog","pr-fix"]') }}
        # Two fresh runners per variant, in case the flake depends on the
        # runner rather than the run.
        shard: [1, 2]
    env:
      VARIANT: ${{ matrix.variant }}
      SHARD: ${{ matrix.shard }}
      REPEATS: ${{ inputs.repeats || '15' }}
      OUT: ${{ github.workspace }}/e2e-out
    steps:
      # The same install as master's Macos-CI job.
      - name: Install macfuse and fuse-t
        run: |
          brew install --cask macfuse
          wget https://github.com/macos-fuse-t/fuse-t/releases/download/1.2.9/fuse-t-macos-installer-1.2.9.pkg
          sudo installer -pkg fuse-t-macos-installer-1.2.9.pkg -target /
      - uses: actions/checkout@v4
      - name: Apply the variant patch
        run: |
          git apply .github/macfuse-exp/common-debug.patch .github/macfuse-exp/common-instrument.patch
          if [ -f ".github/macfuse-exp/$VARIANT.patch" ]; then
            git apply ".github/macfuse-exp/$VARIANT.patch"
          fi
          git diff --stat
      - name: Build the smoke test
        run: cargo test --features=fusedev,fuse-t --test macfuse_smoke --no-run
      - name: Run the smoke test ${{ env.REPEATS }} times
        run: bash .github/macfuse-exp/run.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.variant }}-s${{ matrix.shard }}
          path: e2e-out/results.tsv
          retention-days: 14
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.variant }}-s${{ matrix.shard }}
          path: e2e-out/
          retention-days: 14

  summary:
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
      - name: Summarize
        run: bash .github/macfuse-exp/summarize.sh results
